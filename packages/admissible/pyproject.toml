[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "admissible"
version = "0.1.0"
description = "Provenance-gated memory for agents that move money. A memory-extension layer over Sibyl Memory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "x402[httpx]",
    "httpx",
    # The primitive we extend. Pinned: we reach past the published API into
    # entity_relations and flagged_actors, so the schema is part of our contract.
    "sibyl-memory-client==0.8.1",
    "eth-utils",
    "web3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
admissible = "admissible.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/admissible"]

[tool.pytest.ini_options]
markers = [
    "anvil: differential tests against a locally deployed contract",
    "live: tests that read Base mainnet over the network",
]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
