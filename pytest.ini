; One test run for the whole repository.
;
; Both packages ship their own pytest config so each is usable on its own, but a
; reviewer should be able to type `pytest` at the root and get everything. Two
; details make that work:
;
;   importmode=importlib   the two packages each have tests/conftest.py, and
;                          under the default prepend import mode they collide on
;                          the module name `conftest` -- each suite passes alone
;                          and three fail together, which is the worst way for a
;                          test to be wrong.
;   pythonpath             both src trees, so a checkout works without installing.
;
; Network and chain-dependent tests are excluded by default. Nothing here needs a
; key, a funded wallet, or an internet connection.

[pytest]
testpaths = packages/admissible/tests packages/admissible-mcp/tests
pythonpath = packages/admissible/src packages/admissible-mcp/src
addopts = -m "not live and not anvil" --strict-markers
markers =
    anvil: differential tests against a locally deployed contract
    live: tests that read Base mainnet over the network
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*urllib3.*:Warning
